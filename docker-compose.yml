services:
  web:
    build: .
    container_name: cavity.njk.localhost
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cavity.rule=Host(`cavity.njk.localhost`)"
      - "traefik.http.services.cavity.loadbalancer.server.port=8000"
      - "traefik.http.routers.cavity.tls=true"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy
    volumes:
      - ./:/app
      - deno-kv:/deno-dir/location_data
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgres,plout,db,5432,cavity
      - TOKEN_SECRET=mySuperSecret
      - SENDINBLUE_API_KEY=:D
      - DEVELOPMENT_MODE=1
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: db.njk.localhost
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    environment:
      - POSTGRES_DB=cavity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=plout
      - PGDATA=/var/lib/postgresql/data/cavity
    volumes:
      - /var/lib/postgresql/data/cavity:/var/lib/postgresql/data/cavity

networks:
  proxy:
    external: true

volumes:
  deno-kv:
